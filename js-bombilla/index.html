<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="padding: 0px; margin: 0px; background-color: black;">
    <div class="contenedor-bombilla">
        <img class="bombilla" src="./img/off.jpg" alt="bombilla">
        <div class="interruptor">
            <img class="int-boton" src="./img/bon.jpg" alt="interruptor">
        </div>
    </div>
    <div class="opciones">
        <div class="ligth-level">
            <label for="ligth">Ligth Level</label>
            <input type="range" name="ligth" id="ligth" min="1" max="9" step="1" value="5">
        </div>
        <div class="zoom">
            <label for="zoom-lvl">Ligth bulb zoom</label>
            <input type="range" name="zoom-lvl" id="zoom-lvl" min="1" max="9" step="1" value="5">
        </div>
        <div class="rotation">
            <label for="rotation-lvl">Rotation</label>
            <input type="range" name="rotation-lvl" id="rotation-lvl" min="1" max="9" step="1" value="5">
        </div>
    </div>

</body>
</html>
