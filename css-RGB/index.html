<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Colores primarios</h1>
        <div class="flex-div">
            <div class="circulo color-rojo"></div>
            <div class="circulo color-verde"></div>
            <div class="circulo color-azul"></div>
        </div>

        <h2>Colores Secundarios</h2>
        <div class="flex-div">
            <div class="circulo color-rojo"></div>
            <div class="suma">+</div>
            <div class="circulo color-azul"></div>
            <div class="igual">=</div>
            <div class="circulo color-lila"></div>
        </div>
        <div class="flex-div">
            <div class="circulo color-azul"></div>
            <div class="suma">+</div>
            <div class="circulo color-verde"></div>
            <div class="igual">=</div>
            <div class="circulo color-turquesa"></div>
        </div>
        <div class="flex-div">
            <div class="circulo color-verde"></div>
            <div class="suma">+</div>
            <div class="circulo color-rojo"></div>
            <div class="igual">=</div>
            <div class="circulo color-amarillo"></div>
        </div>
    </main>
</body>
</html>
