<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js"></script>
    <link rel="stylesheet" href="./node_modules/nes.css/css/nes.min.css">
    <style>
        
        .contenedor-principal {
            background-color: #e3c7c3;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .contenedor-principal>div {
            display: flex;
            width: 80%;
            min-width: 400px;
        }

        .frase-api {
            width: 100%;
        }
        
        img {
            border: 1px solid black;
            background-color: orange;
            image-rendering: pixelated;
            margin: auto;
        }
        
        button {
            height: 40px;
            align-items: center;
            justify-content: center;
            display: flex;
            width: 15%;
        }
        @media(width < 550px) {
            .contenedor-principal>div {
                min-width: 100%;
            }
            .frase-api{
                width: 100%;
            }
            button{
                min-width: 100%;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="nes-container is-rounded contenedor-principal">
            <div>
                <img class="nes-avatar is-rounded is-large" alt="Gravatar image example" src="chuck-norris-trnsp.png">
                <div class="nes-container is-rounded is-dark frase-api">
                    <p class="nes-text">TEST NES</p>
                </div>
            </div>
            <button type="button" class="nes-btn is-error">Next</button>
        </div>
    </main>
</body>

</html>
