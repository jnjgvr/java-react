<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regexp</title>
</head>
<body>
    <header>
        <h1>Validación de teléfono mediante a expresiones regulares:</h1>
    </header>
    <main>
        <form action="#">
            <label for="tlf">Teléfono:</label>
            <input type="text" name="tlf" class="form-control" placeholder="Enter 9 digits of your phone" pattern="\d{9}" title="Debe contener exactamente 9 dígitos" required />
            <input type="submit">
        </form>        
    </main>

</body>
</html>
